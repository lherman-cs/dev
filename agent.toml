# Toolbox-owned Codex overlay. Embedded into the binary with include_str!.
# These values are applied as runtime `codex -c key=value` overrides, so they
# augment (and intentionally override only these keys from) ~/.codex/config.toml.

[codex]
model_verbosity = "low"
model_reasoning_summary = "concise"
model_auto_compact_token_limit = 120000
model_auto_compact_token_limit_scope = "total"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[codex.agents]
enabled = false

[profiles.default]
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[profiles.plan]
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[profiles.build]
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[profiles.review]
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[workflows.plan]
skill = "dev-plan"

[workflows.build]
skill = "dev-build"

[workflows.review]
skill = "dev-review"

# Starting diagnostics derived from the pathological session. These warn; they
# never kill a legitimate Codex run.
[stats]
warn_model_calls = 80
bad_model_calls = 120
warn_peak_input_tokens = 100000
bad_peak_input_tokens = 120000
warn_compactions = 1
bad_compactions = 2
