# Runtime policy and command-to-role routing ONLY.
# Models/reasoning live exclusively in dotfiles/.codex/agents/<role>.toml.
[codex]
model_verbosity = "low"
model_reasoning_summary = "concise"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
approvals_reviewer = "auto_review"
model_auto_compact_token_limit = 200000
model_auto_compact_token_limit_scope = "total"

[codex.agents]
enabled = true
max_concurrent_threads_per_session = 3
interrupt_message = true

# Default is a no-task interactive/trust session, not automatic orchestration.
[profiles.default]
role = "orchestrator"
[profiles.spec]
role = "specifier"
[profiles.plan]
role = "planner"
[profiles.explore]
role = "explorer"
[profiles.build]
role = "builder"
[profiles.review]
role = "reviewer"
[profiles.project]
role = "orchestrator"

[stats]
warn_model_calls = 80
bad_model_calls = 120
warn_peak_input_tokens = 100000
bad_peak_input_tokens = 160000
warn_compactions = 1
bad_compactions = 2
