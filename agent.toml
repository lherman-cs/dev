# Toolbox-owned Codex workflow overlay.

[codex]
model_verbosity = "low"
model_reasoning_summary = "concise"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
approvals_reviewer = "auto_review"
model_auto_compact_token_limit = 200000
model_auto_compact_token_limit_scope = "total"


# Native interactive agents only. Managed project sessions disable native spawning; dev owns their lifecycle.
[codex.agents]
enabled = true
max_concurrent_threads_per_session = 3


[profiles.default]
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"


[profiles.plan]
agent = "planner"
skill = "dev-plan"

[profiles.project]
agent = "orchestrator"
skill = "dev-project"

[profiles.build]
agent = "builder"
skill = "dev-build"

[profiles.review]
agent = "reviewer"
skill = "dev-review"

[stats]
warn_model_calls = 80
bad_model_calls = 120

warn_peak_input_tokens = 100000
bad_peak_input_tokens = 160000

warn_compactions = 1
bad_compactions = 2
