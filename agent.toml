# Toolbox-owned Codex overlay.

[codex]
model_verbosity = "low"
model_reasoning_summary = "concise"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[codex.agents]
enabled = false

[profiles.default]
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[profiles.plan]
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
skill = "dev-plan"

[profiles.build]
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
skill = "dev-build"

[profiles.review]
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
skill = "dev-review"

[stats]
warn_model_calls = 80
bad_model_calls = 120
warn_peak_input_tokens = 100000
bad_peak_input_tokens = 160000
warn_compactions = 1
bad_compactions = 2
