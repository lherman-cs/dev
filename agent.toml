# Toolbox-owned Codex workflow overlay.

[codex]
model_verbosity = "low"
model_reasoning_summary = "concise"

approval_policy = "on-request"
sandbox_mode = "workspace-write"


# One root agent + at most one repository explorer.
[codex.agents]
enabled = true
max_concurrent_threads_per_session = 1


[profiles.default]
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"


[profiles.plan]
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
skill = "dev-plan"


[profiles.build]
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
skill = "dev-build"


[profiles.review]
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
skill = "dev-review"


[stats]
warn_model_calls = 80
bad_model_calls = 120

warn_peak_input_tokens = 100000
bad_peak_input_tokens = 160000

warn_compactions = 1
bad_compactions = 2
