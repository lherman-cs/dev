# Runtime policy and command-to-role routing ONLY.
# Concrete model/reasoning choices live in dotfiles/.codex/agents/*.toml.
[codex]
model_verbosity = "low"
model_reasoning_summary = "concise"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
model_auto_compact_token_limit = 200000
model_auto_compact_token_limit_scope = "total"

# Routine local development access; role instructions still define task authority.
[codex.permissions.dev-workspace]
extends = ":workspace"
[codex.permissions.dev-workspace.filesystem]
"~/.cache" = "write"
"~/.cargo" = "write"
"~/.cargo/credentials.toml" = "read"
"~/.cargo/credentials" = "read"
"~/.rustup" = "write"
"~/.npm" = "write"
"~/.gradle" = "write"
"~/.m2" = "write"
"~/go/pkg/mod" = "write"
"~/go/bin" = "write"
"~/.local/bin" = "write"
"~/.local/lib" = "write"
"~/.local/share/pnpm" = "write"
"~/.local/state/pnpm" = "write"
"~/.local/share/uv" = "write"
"~/.local/share/containers" = "write"
"~/.bun/install/cache" = "write"
[codex.permissions.dev-workspace.network]
enabled = true
[codex.permissions.dev-builder]
extends = "dev-workspace"
[codex.permissions.dev-builder.filesystem]
# The launcher adds only the current repository's resolved Git metadata path.

# Explorer can research upstream and use scratch files, but cannot edit projects.
[codex.permissions.dev-explorer]
extends = ":read-only"
[codex.permissions.dev-explorer.filesystem]
":tmpdir" = "write"
":slash_tmp" = "write"
[codex.permissions.dev-explorer.network]
enabled = true

[codex.agents]
enabled = true
# One active worker/reviewer, the task-local warm Builder, and narrow exploration.
# Capacity is not permission to add reviewers or parallel writers.
max_concurrent_threads_per_session = 4
interrupt_message = true

[profiles.default]
role = "orchestrator"
[profiles.spec]
role = "specifier"
[profiles.plan]
role = "planner"
[profiles.explore]
role = "explorer"
[profiles.build]
role = "builder"
[profiles.review]
role = "reviewer"
[profiles.project]
role = "orchestrator"

[stats]
warn_model_calls = 80
bad_model_calls = 120
warn_peak_input_tokens = 100000
bad_peak_input_tokens = 160000
warn_compactions = 1
bad_compactions = 2
