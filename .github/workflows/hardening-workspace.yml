name: hardening workspace
on:
  push:
    branches: [fix/pi-minimal-workflow]
    paths: [.github/workflows/hardening-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix pi
      - name: Export source and pinned SDK for offline regression tests
        run: |
          mkdir -p .inspection
          cp "$(command -v node)" .inspection/node
          git rev-parse HEAD > .inspection/head
          tar --exclude=.git -czf /tmp/hardening-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: hardening-workspace
          path: /tmp/hardening-workspace.tgz
          retention-days: 1
