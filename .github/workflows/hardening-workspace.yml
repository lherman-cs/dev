name: hardening workspace
on:
  push:
    branches: [feat/agent-hub-dx]
    paths: [.github/workflows/hardening-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact source for offline regression tests
        run: |
          mkdir -p .inspection
          git rev-parse HEAD > .inspection/head
          tar --exclude=.git -czf /tmp/agent-hub-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: agent-hub-source
          path: /tmp/agent-hub-source.tgz
          retention-days: 1
