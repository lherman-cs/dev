<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dev brief</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/mermaid.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#brief">Skip to brief</a>
  <div class="layout">
    <aside class="rail" aria-label="Brief navigation">
      <div class="brand">DEV <span aria-hidden="true">/</span> BRIEF</div>
      <div class="edition">Branch consequence brief</div>
      <nav id="section-nav" aria-label="Sections"></nav>
    </aside>
    <div class="document">
      <header class="masthead">
        <div class="masthead-row"><div class="masthead-meta"><span><small>merge-base</small><strong id="base"></strong></span><span><small>current snapshot</small><strong id="endpoint"></strong></span><span><small>generated</small><strong id="created"></strong></span><span><small>files captured</small><strong id="files-count"></strong></span><span><small>lines captured</small><strong id="lines-count"></strong></span></div><details class="identity"><summary id="identity">View details →</summary><p id="revision-id"></p><p id="provenance"></p></details></div>
        <p class="stale" id="stale" role="status" hidden></p>
      </header>
      <main id="brief" tabindex="-1"><p>Loading brief…</p></main>
      <footer class="feedback" aria-label="Revision feedback">
        <div class="section-label">Your perspective</div>
        <h2>Revision note</h2>
        <p class="feedback-intro">For anything the brief misses or misstates overall.</p>
        <label for="general">General feedback</label>
        <textarea id="general" rows="4"></textarea>
        <p class="save-state" id="general-state" role="status"></p>
        <div class="export-row"><button id="export" type="button">Export feedback Markdown</button><p id="export-state" role="status"></p></div>
      </footer>
    </div>
  </div>
</body>
</html>
